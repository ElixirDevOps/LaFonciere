# constat:template id=elixir-ci-workflow version=39 sha256=792e8c8f021e487389bf8b498918909a47376b5f0b672388f9c929b019642fed
name: constat-ci
# Generated by Constat's onboarding pull request. Runs "mix test" with
# Constat.CheckReportFormatter enabled and publishes the per-test report it writes, plus a second
# job that reruns the same suite against the code as it was before the change.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27.1.2'
      - run: mix deps.get
      - id: tests
        run: mix test
      - if: always() && steps.tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-check-report
          path: .constat/check-report/checks.json
          if-no-files-found: error

  base-comparison:
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: head-report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: constat-check-report
          path: .constat/head-report
      - if: steps.head-report.outcome != 'success'
        run: |
          echo "::warning::the test job published no constat-check-report, so there is nothing to" \
               "compare against; publishing no before-code report. Constat will read every" \
               "criterion as passed-but-unproven, which is the honest degradation."
      - uses: erlef/setup-beam@v1
        if: steps.head-report.outcome == 'success'
        with:
          elixir-version: '1.17'
          otp-version: '27.1.2'
      - if: steps.head-report.outcome == 'success'
        run: bash .github/scripts/constat-rewind-to-base.sh "${{ github.base_ref }}"
      - if: steps.head-report.outcome == 'success'
        run: mix deps.get
      - id: base-tests
        if: steps.head-report.outcome == 'success'
        continue-on-error: true
        env:
          CONSTAT_CHECK_REPORT_PATH: .constat/check-report-base/checks.json
          CONSTAT_EXPECTED_REPORT: .constat/head-report/checks.json
        run: mix test
      - if: always() && steps.base-tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-check-report-base
          path: .constat/check-report-base/checks.json
          if-no-files-found: error
