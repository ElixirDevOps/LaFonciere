# constat:template id=elixir-coverage-mutation-workflow version=24 sha256=32bdd2578117506ae9dd84ac6ad7dc23c9a294582a4c191e8e894dd313d8e4b0
name: constat-ci-coverage-mutation
# Generated by Constat's onboarding pull request. Publishes exactly the catalog entries this
# repository's CI did not already publish (see @constat/evidence's EVIDENCE_CATALOG) — the third
# proof (line coverage) and/or the fourth (mutation), whichever this repository was missing. It
# never touches constat-ci.yml or any job already publishing the check report: this file is
# additive, on purpose, so a repository catching up loses nothing it already had.
on:
  pull_request:
jobs:
  coverage:
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27.1.2'
      - run: mix deps.get
      # Best-effort by design: a single test file's coverage run failing must not take down every
      # OTHER check's coverage comparison — the script itself catches and logs per-file failures.
      - run: bash .github/scripts/constat-mix-coverage.sh .constat/check-coverage/coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: constat-check-coverage
          path: .constat/check-coverage/coverage.json
          if-no-files-found: error

  mutation:
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MUTATION_MAX_MUTANTS: 6
      MUTATION_BUDGET_SECONDS: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27.1.2'
      - run: mix deps.get
      - run: elixir .github/scripts/constat-mix-mutation.exs "${{ github.base_ref }}" .constat/check-mutation/mutation.json
      - if: always()
        run: |
          git status --porcelain
          git checkout -- .
      - uses: actions/upload-artifact@v4
        with:
          name: constat-check-report-mutation
          path: .constat/check-mutation/mutation.json
          if-no-files-found: error
