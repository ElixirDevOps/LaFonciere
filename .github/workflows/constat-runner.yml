# constat:template id=node-runner-workflow version=24 sha256=ebd90a76a40b2ba946ab07dc33e915ab57ad44aff0058c3e0e050c86ad9d83f8
name: constat-runner
# Generated by Constat. Picks up attempts you dispatch in Constat and runs them HERE — on this
# repository's own Actions runner, with this repository's own model key. Constat never holds the
# key and never starts anything itself; it queues the work, this workflow does it, and Constat then
# witnesses what CI did with its own read-only credential.
#
# Identity: the OIDC token GitHub mints for this job. Nothing to paste, nothing to rotate.
# The secrets, by NAME: ANTHROPIC_API_KEY — read by the agent your CI runs, never sent to Constat.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # GitHub honours the five-minute schedule loosely — hours apart on a quiet repository. So the
  # runner also wakes when CI or a release finishes on the default branch — but GitHub chains that
  # wake only when a person started that run, never from a run this runner pressed with its own
  # token. Names that do not exist here are simply never fired. So the first wake after you press
  # Dispatch or Release is yours: press Run here. Constat presses nothing.
  workflow_run:
    workflows: [ci, constat-ci, constat-release]
    types: [completed]
permissions:
  id-token: write
  contents: write
  pull-requests: write
  # To press your CI workflow's Run button on the agent's branch: a push made with this token
  # never starts CI by itself, and without this line pressing the button is refused (HTTP 403).
  actions: write
# One attempt at a time per repository: two agents on one branch race each other's commits. It is
# also what makes the standing wake's handover clean — a run pressed while one is standing waits
# here until that one is gone, and the job below stands down anyway if it finds one still up.
concurrency:
  group: constat-runner
  cancel-in-progress: false
jobs:
  run:
    # Where this project's attempts run (spec of 6 September 2026). GitHub's machines unless the
    # project named a runner of its own, and then that runner's label, so the loop keeps running
    # after a month of GitHub minutes has gone.
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Nothing is installed before asking: a wake with nothing queued, or a release (a git merge),
      # ends in seconds. The script installs the agent's CLI only once an attempt is taken (the travel
      # test, 4 September 2026: seven minutes of installing an app to perform a merge).
      # Node itself, and no cache: this repository has no lock file for setup-node to key a cache
      # on, and asking for one would end this job here, before it has asked Constat for anything.
      - name: Ask Constat for a queued attempt, and run it if there is one
        env:
          CONSTAT_URL: "https://app.constat.io"
          CONSTAT_AGENT_CLI: "@anthropic-ai/claude-code@2.1.257"
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node .github/scripts/constat-runner.mjs
